name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  build:
    runs-on: ubuntu-latest
    services:
      relic-postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: relic_tests
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d relic_tests"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20.19.x"

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 10.22.0

      - name: Resolve pnpm store path
        id: pnpm-store-path
        run: |
          STORE_PATH=$(pnpm store path)
          echo "pnpm_store_path=$STORE_PATH" >> $GITHUB_OUTPUT

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-store-path.outputs.pnpm_store_path }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm run prisma:generate

      - name: Verify champion data, UI and Discord rendering
        run: pnpm exec vitest run src/domain/champion-overview-summary.test.ts web/src/lib/champion-kit.test.ts web/src/lib/champion-kit-source-display.test.ts web/src/lib/champion-kit-synergy-bonus.test.ts web/src/lib/champion-synergy-display.test.ts 'web/src/app/champions/[slug]/champion-synergies-panel.test.ts' web/src/lib/roster-kit.test.ts web/src/lib/roster-kit-details.test.ts web/src/lib/roster-filtering.test.ts web/src/lib/alliance-roster-filtering.test.ts web/src/app/actions/alliance-roster.test.ts web/src/app/profile/roster/components/roster-filter-rules.test.ts web/src/components/champions/compact-effect-grid.test.ts web/src/app/profile/roster/components/quick-champion-dialog.test.ts src/commands/champion src/commands/search src/commands/glossary/effect.test.ts src/utils/errorHandler.test.ts --maxWorkers=1

      - name: Build Bot (src)
        run: pnpm run build-only

      - name: Verify relic data, formatting and cloud image publication
        run: pnpm run test:relics

      - name: Verify exact relic source preservation in PostgreSQL
        env:
          RELIC_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/relic_tests
        run: pnpm exec vitest run src/services/relicCatalogImportService.postgres.test.ts --maxWorkers=1

      - name: Verify multiple fight recordings
        run: pnpm exec vitest run src/domain/war-recordings.test.ts web/src/lib/war-recording-upload.test.ts 'web/src/app/war-videos/[videoId]/page.recordings.test.ts' web/src/lib/war-death-summary.test.ts web/src/components/war-planning/war-death-summary.test.ts web/src/app/analysis/season-overview/season-data.test.ts --maxWorkers=1

      - name: Verify recording migration, concurrent submissions and historical statistics
        env:
          WAR_RECORDINGS_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/cerebro_recordings_test
        run: |
          node scripts/setup-war-recordings-test-db.cjs --create-database
          pnpm exec vitest run src/services/warRecordingService.integration.test.ts web/src/app/planning/history-actions.recordings.test.ts web/src/lib/api/war-recording-submission.test.ts --maxWorkers=1

      - name: Verify source-bound resistance classifications and discovery
        run: pnpm exec vitest run src/domain/champion-resistance.test.ts src/domain/champion-resistance-classification.test.ts src/domain/champion-resistance-plan.test.ts web/src/lib/champion-resistance.test.ts web/src/lib/roster-kit-options.test.ts web/src/lib/data/champion-resistances.test.ts web/src/lib/champion-ability-text.test.ts web/src/components/champions/effect-sources.test.ts 'web/src/app/api/champions/[slug]/kit/route.test.ts' --maxWorkers=1

      - name: Build Web (web)
        run: pnpm --filter ./web... run build
