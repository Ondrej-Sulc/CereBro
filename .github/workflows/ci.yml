name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20.19.x"

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 10.22.0

      - name: Resolve pnpm store path
        id: pnpm-store-path
        run: |
          STORE_PATH=$(pnpm store path)
          echo "pnpm_store_path=$STORE_PATH" >> $GITHUB_OUTPUT

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-store-path.outputs.pnpm_store_path }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm run prisma:generate

      - name: Verify champion data, UI and Discord rendering
        run: pnpm exec vitest run src/domain/champion-overview-summary.test.ts web/src/lib/champion-kit.test.ts web/src/lib/roster-kit.test.ts web/src/lib/roster-kit-details.test.ts web/src/components/champions/compact-effect-grid.test.ts web/src/app/profile/roster/components/quick-champion-dialog.test.ts src/commands/champion/champion.test.ts src/commands/champion/pagination.test.ts src/utils/errorHandler.test.ts --maxWorkers=1

      - name: Build Bot (src)
        run: pnpm run build-only

      - name: Verify source-bound resistance classifications and discovery
        run: pnpm exec vitest run src/domain/champion-resistance.test.ts src/domain/champion-resistance-classification.test.ts src/domain/champion-resistance-plan.test.ts web/src/lib/champion-resistance.test.ts web/src/lib/roster-kit-options.test.ts web/src/lib/data/champion-resistances.test.ts --maxWorkers=1

      - name: Build Web (web)
        run: pnpm --filter ./web... run build
