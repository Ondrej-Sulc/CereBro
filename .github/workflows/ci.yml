name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  build:
    runs-on: ubuntu-latest
    services:
      relic-postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: relic_tests
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d relic_tests"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24.x"

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 10.22.0

      - name: Resolve pnpm store path
        id: pnpm-store-path
        run: |
          STORE_PATH=$(pnpm store path)
          echo "pnpm_store_path=$STORE_PATH" >> $GITHUB_OUTPUT

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-store-path.outputs.pnpm_store_path }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm run prisma:generate

      - name: Verify champion artwork fallbacks
        run: pnpm exec vitest run web/src/lib/championHelper.test.ts --maxWorkers=1

      - name: Verify champion data, UI and Discord rendering
        run: pnpm exec vitest run src/domain/champion-overview-summary.test.ts web/src/lib/champion-kit.test.ts web/src/lib/champion-kit-source-display.test.ts web/src/lib/champion-kit-synergy-bonus.test.ts web/src/lib/champion-synergy-display.test.ts 'web/src/app/champions/[slug]/champion-synergies-panel.test.ts' web/src/lib/roster-kit.test.ts web/src/lib/roster-kit-details.test.ts web/src/lib/roster-filtering.test.ts web/src/lib/alliance-roster-filtering.test.ts web/src/app/actions/alliance-roster.test.ts web/src/app/profile/roster/components/roster-filter-rules.test.ts web/src/components/champions/compact-effect-grid.test.ts web/src/lib/game-icon-url.test.ts 'web/src/app/api/game-icons/[family]/[file]/route.test.ts' web/src/app/profile/roster/components/quick-champion-dialog.test.ts src/commands/champion src/commands/search src/commands/glossary/effect.test.ts web/src/lib/effect-glossary.test.ts web/src/lib/data/effect-glossary.test.ts web/src/app/glossary/glossary-views.test.tsx src/utils/errorHandler.test.ts --maxWorkers=1

      - name: Verify champion page interactions and native stat icons
        run: pnpm exec vitest run src/tests/stat-icons.test.ts 'web/src/app/champions/[slug]/champion-stats-panel.test.tsx' 'web/src/app/champions/[slug]/champion-attack-profile.test.tsx' 'web/src/app/champions/[slug]/champion-details-navigation.test.tsx' 'web/src/app/champions/[slug]/champion-ability-reader.test.tsx' 'web/src/app/champions/[slug]/champion-synergies-interaction.test.tsx' web/src/lib/champion-synergies.test.ts web/src/lib/champion-ability-search.test.ts web/src/lib/champion-attack-profile.test.ts web/src/lib/champion-attack-sequence.test.ts --maxWorkers=1

      - name: Build Bot (src)
        run: pnpm run build-only

      - name: Verify bounded Google API imports and YouTube OAuth
        run: pnpm exec vitest run src/tests/google-api-imports.test.ts web/src/app/api/admin/youtube/oauth.test.ts --maxWorkers=1

      - name: Verify game-backed ascension rules and roster updates
        run: pnpm exec vitest run src/domain/champion-ascension.test.ts src/domain/champion-ascension-classification.test.ts src/data/game-ascension/index.test.ts web/src/lib/data/carina-ascension-eligibility.test.ts src/domain/roster-ascension-state.test.ts src/services/rosterService.test.ts web/src/lib/data/champions.test.ts web/src/lib/roster-recommendation-service.test.ts web/src/lib/roster-recommendation-service-adapter.test.ts web/src/components/roster-ascension-control.test.tsx web/src/app/profile/roster/components/modals/ascension-controls.test.tsx web/src/lib/mcoc-prestige.test.ts web/src/lib/combat-ascension-regression.test.ts web/src/lib/prestige-ascension-regression.test.ts 'web/src/app/player/[id]/page.prestige.test.tsx' 'web/src/app/profile/roster/components/modals/prestige-chart-modal.test.tsx' web/src/lib/champion-page-state.test.ts web/src/lib/global-prestige-list.test.ts web/src/lib/roster-ascension-filter.test.ts web/src/app/profile/roster/components/roster-eligibility-filter.test.tsx 'web/src/app/champions/[slug]/champion-ascension-interaction.test.tsx' web/src/app/api/profile/roster/add/route.test.ts web/src/app/api/profile/roster/manage/route.test.ts --maxWorkers=1

      - name: Setup Python for game data validation
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify crystal extraction and champion pool browsing
        run: |
          python3 -m pip install -r scripts/requirements-game-data.txt
          python3 -m unittest discover -s scripts -p test_extract_mcoc_crystals.py
          python3 -m unittest discover -s scripts -p test_extract_mcoc_crystal_artwork.py
          python3 -m unittest discover -s scripts -p test_extract_mcoc_reward_artwork.py
          python3 -m unittest discover -s scripts -p test_reward_palette.py
          python3 -m unittest discover -s scripts -p test_extract_mcoc_crystal_rules.py
          python3 -m unittest discover -s scripts -p test_import_mcoc_crystal_odds.py
          python3 -m unittest discover -s scripts -p test_collect_mcoc_crystal_odds.py
          python3 -m unittest discover -s scripts -p test_calibrate_mcoc_crystal_odds.py
          python3 -m unittest discover -s scripts -p test_extract_mcoc_crystal_openings.py
          python3 -m unittest discover -s scripts -p test_build_crystal_history.py
          python3 -m unittest discover -s scripts -p test_extract_mcoc_ascension.py
          pnpm exec vitest run src/domain/champion-crystals.test.ts src/domain/crystal-families.test.ts src/domain/crystal-browsing.test.ts src/domain/crystal-categories.test.ts src/services/crystalArtworkService.test.ts src/tests/crystal-catalog.test.ts src/tests/crystal-artwork.test.ts 'web/src/app/api/champions/[slug]/crystals/route.test.ts' 'web/src/app/champions/[slug]/champion-crystals-panel.test.tsx' 'web/src/app/champions/[slug]/champion-details-navigation.test.tsx' 'web/src/app/crystals/crystal-pages.test.tsx' web/src/app/crystals/crystal-filters.test.tsx web/src/app/crystals/crystal-champion-grid.test.tsx web/src/app/crystals/crystal-tools.test.tsx web/src/components/compact-crystal-family-grid.test.tsx web/src/app/crystals/crystal-tools-nav.test.tsx web/src/app/api/crystals/search/route.test.ts web/src/lib/data/crystals.test.ts web/src/lib/data/crystal-finder-eligibility.test.ts web/src/app/crystals/champions/page.test.tsx web/src/lib/crystal-browse-groups.test.ts web/src/lib/champion-crystal-groups.test.ts web/src/lib/crystal-browse-return.test.ts web/src/lib/crystal-catalog-state.test.ts web/src/app/crystals/crystal-browse-navigation.test.tsx web/src/app/crystals/crystal-data-notes.test.tsx web/src/lib/champion-page-state.test.ts web/src/lib/crystal-catalog-artwork.test.ts web/src/app/crystals/crystal-catalog-artwork.test.tsx web/src/lib/crystal-finder-artwork.test.ts web/src/app/crystals/crystal-finder-artwork.test.tsx --maxWorkers=1

      - name: Verify champion acquisition sources and presentation
        run: pnpm exec vitest run src/domain/champion-acquisition.test.ts src/domain/champion-ascension-acquisition.test.ts src/data/champion-ascension-acquisition/index.test.ts web/src/lib/data/champion-ascension-acquisition.test.ts web/src/components/champion-ascension-acquisition.test.tsx src/data/champion-acquisition/index.test.ts src/data/champion-acquisition/coverage.test.ts 'web/src/app/champions/[slug]/champion-acquisition-panel.test.tsx' web/src/lib/data/champion-crystal-ascension.test.ts web/src/lib/data/champion-crystal-ascension-bindings.test.ts 'web/src/app/champions/[slug]/champion-ascension-sources.test.tsx' 'web/src/app/api/champions/[slug]/ascension-sources/route.test.ts' --maxWorkers=1

      - name: Verify reviewed crystal availability
        run: pnpm exec vitest run src/domain/crystal-availability.test.ts src/data/game-crystals/availability.test.ts web/src/app/crystals/crystal-availability.test.tsx --maxWorkers=1

      - name: Verify crystal rate presentation and artwork matching
        run: pnpm exec vitest run web/src/lib/crystal-odds-presentation.test.ts web/src/lib/data/crystal-page-rewards.test.ts web/src/lib/crystal-reward-groups.test.ts web/src/lib/crystal-reward-presentation.test.ts web/src/lib/crystal-ascension-bonuses.test.ts web/src/app/crystals/crystal-ascension-bonuses.test.tsx web/src/app/crystals/crystal-rewards-browser.test.tsx web/src/app/crystals/crystal-reward-cards.test.tsx web/src/app/crystals/crystal-odds-disclosure.test.tsx web/src/app/crystals/crystal-odds-interaction.test.tsx --maxWorkers=1

      - name: Verify full crystal rewards, odds and chronology
        run: pnpm exec vitest run src/domain/crystal-openings.test.ts src/domain/crystal-ascension-rewards.test.ts src/data/game-crystal-openings/index.test.ts src/domain/crystal-odds.test.ts src/domain/crystal-chronology.test.ts src/domain/crystal-history.test.ts src/data/game-crystal-history/index.test.ts src/domain/reward-artwork.test.ts src/services/rewardArtworkService.test.ts src/data/game-reward-artwork/index.test.ts web/src/lib/data/crystal-openings.test.ts web/src/lib/data/crystal-browse-catalog.test.ts web/src/lib/data/crystal-seven-star-browse.test.ts web/src/app/crystals/crystal-opening-pages.test.tsx web/src/app/crystals/crystal-odds-disclosure.test.tsx web/src/app/crystals/crystal-routes.test.tsx --maxWorkers=1

      - name: Verify reusable reward names and server logger reloads
        run: pnpm exec vitest run src/domain/reward-display.test.ts src/domain/selectable-rewards.test.ts src/data/game-selectable-rewards/index.test.ts web/src/lib/logger.test.ts --maxWorkers=1

      - name: Verify supporter screenshot access and recurring payments
        run: pnpm exec vitest run src/services/rosterScreenshotQuotaService.test.ts web/src/lib/support-status.test.ts web/src/lib/support-config.test.ts web/src/lib/support-donations.test.ts web/src/lib/stripe-support-invoice.test.ts web/src/app/api/support/webhook/route.test.ts --maxWorkers=1

      - name: Verify Discord identity and account switching
        run: pnpm exec vitest run web/src/auth.test.ts web/src/app/actions/auth.test.ts web/src/app/auth/signin/page.test.ts web/src/app/auth/error/page.test.ts 'web/src/app/api/auth/[...nextauth]/route.test.ts' web/src/lib/discord-profile-sync.test.ts --maxWorkers=1

      - name: Verify war map boundaries and defense planning
        run: pnpm exec vitest run src/domain/war-map.test.ts web/src/app/api/war-planning/nodes/route.test.ts web/src/app/api/war-planning/placements/route.test.ts web/src/app/planning/defense-map-actions.test.ts web/src/app/planning/defense-actions.test.ts web/src/components/war-planning/hooks/use-defense-planning.test.ts web/src/components/war-planning/hooks/use-war-planning.test.ts --maxWorkers=1

      - name: Verify canvas recovery, hydration and error reporting
        run: pnpm exec vitest run web/src/components/war-planning/hooks/use-canvas-size.test.ts web/src/components/war-planning/war-map/map-error-boundary.test.tsx web/src/app/profile/components/profile-manager.hydration.test.tsx web/src/components/PostHogProvider.test.ts web/src/lib/observability/source-map-config.test.ts web/next.config.test.ts web/src/app/api/profile/roster/manage/route.test.ts web/src/lib/observability/ignored-browser-errors.test.ts web/src/lib/observability/reportable-client-exceptions.test.ts --maxWorkers=1

      - name: Verify relic data, formatting and cloud image publication
        run: pnpm run test:relics

      - name: Verify catalog and personal-view navigation
        run: pnpm exec vitest run web/src/lib/collection-view.test.ts web/src/components/Header.test.tsx --maxWorkers=1

      - name: Verify homepage discovery and champion lookup
        run: pnpm exec vitest run web/src/app/page.test.tsx web/src/components/home/HomeChampionSearch.test.tsx web/src/components/home/ScreenshotPreview.test.tsx web/src/lib/data/home-featured-champions.test.ts web/src/lib/data/home-featured-relics.test.ts web/src/app/api/champions/lookup/route.test.ts --maxWorkers=1

      - name: Verify exact relic source preservation in PostgreSQL
        env:
          RELIC_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/relic_tests
        run: pnpm exec vitest run src/services/relicCatalogImportService.postgres.test.ts src/services/playerRelicService.postgres.test.ts --maxWorkers=1

      - name: Verify multiple fight recordings
        run: pnpm exec vitest run src/domain/war-recordings.test.ts src/services/distribution/warPlanDistributor.test.ts web/src/lib/war-recording-upload.test.ts 'web/src/app/war-videos/[videoId]/page.recordings.test.ts' web/src/lib/war-death-summary.test.ts web/src/components/war-planning/war-death-summary.test.ts web/src/app/analysis/season-overview/season-data.test.ts --maxWorkers=1

      - name: Verify recording migration, concurrent submissions and historical statistics
        env:
          WAR_RECORDINGS_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/cerebro_recordings_test
        run: |
          node scripts/setup-war-recordings-test-db.cjs --create-database
          pnpm exec vitest run src/services/warRecordingService.integration.test.ts web/src/app/planning/history-actions.recordings.test.ts web/src/lib/api/war-recording-submission.test.ts --maxWorkers=1

      - name: Verify source-bound resistance classifications and discovery
        run: pnpm exec vitest run src/domain/champion-resistance.test.ts src/domain/champion-resistance-classification.test.ts src/domain/champion-resistance-plan.test.ts web/src/lib/champion-resistance.test.ts web/src/lib/roster-kit-options.test.ts web/src/lib/data/champion-resistances.test.ts web/src/lib/champion-ability-text.test.ts web/src/components/champions/effect-sources.test.ts 'web/src/app/api/champions/[slug]/kit/route.test.ts' --maxWorkers=1

      - name: Typecheck portable feature tests
        env:
          NODE_OPTIONS: --max-old-space-size=4096
        run: pnpm exec tsc --noEmit --project scripts/validation/feature-tests.tsconfig.json

      - name: Verify permanent quest maps, rewards and encounter regions
        run: pnpm exec vitest run --config scripts/game-quests/vitest.config.mts

      - name: Verify Class, Challenge and Event Tower presentation
        run: pnpm exec vitest run --config web/src/lib/game-towers/vitest.config.mts

      - name: Verify node locations and exact reward sources
        run: pnpm exec vitest run --config web/src/lib/game-discovery/vitest.config.mts

      - name: Verify public node catalogs and shared modifier icons
        run: pnpm exec vitest run src/domain/node-modifiers web/src/app/nodes web/src/components/nodes web/src/lib/public-node-modifiers.test.ts web/src/lib/expanded-node-modifiers.icons.test.ts web/src/lib/expanded-node-detail-storage.test.ts web/src/app/admin/nodes/actions.icons.test.ts --maxWorkers=1

      - name: Verify artwork library storage and search
        run: pnpm exec vitest run web/src/lib/game-artwork/storage.test.ts web/src/lib/game-artwork/discovery.test.ts web/src/components/game-artwork/artwork-browser.test.tsx --maxWorkers=1

      - name: Verify resumable duel evidence tooling
        run: pnpm exec vitest run src/domain/duel-target-verification.test.ts src/domain/duel-target-job.test.ts src/domain/duel-search-observation.test.ts src/domain/duel-pilot-report.test.ts --maxWorkers=1

      - name: Verify exact public reward and resource definitions
        run: |
          pnpm exec tsx --test src/data/game-reward-definitions/index.test.ts
          pnpm exec tsx --test src/data/game-resource-definitions/index.test.ts

      - name: Verify portable quest and node extraction contracts
        run: |
          # Named test modules only: never discover live readers or require local captures.
          python3 -m unittest discover -s scripts -p test_extract_mcoc_node_modifiers.py
          python3 -m unittest discover -s scripts -p test_extract_mcoc_node_artwork.py
          python3 -m unittest discover -s scripts -p test_project_mcoc_node_uses.py
          python3 -m unittest discover -s scripts -p test_project_mcoc_node_icon_registry.py
          python3 -m unittest discover -s scripts -p test_build_mcoc_node_expansion.py
          python3 -m unittest discover -s scripts -p test_project_mcoc_node_expansion_icons.py
          python3 -m unittest discover -s scripts -p test_export_mcoc_node_icon_extension.py
          python3 -m unittest discover -s scripts/game-quests -p test_act10_normalizer.py
          python3 -m unittest discover -s scripts/game-quests -p test_build_public_resource_artwork.py
          python3 -m unittest discover -s scripts/game-quests -p test_build_reward_definition_artwork.py
          python3 -m unittest discover -s scripts/game-quests -p test_build_tower_blocks.py
          python3 -m unittest discover -s scripts/game-quests -p test_challenge_towers.py
          python3 -m unittest discover -s scripts/game-quests -p test_event_towers.py
          python3 -m unittest discover -s scripts/game-quests -p test_tower_backend_contract.py
          python3 -m unittest discover -s scripts/game-quests -p test_tower_backend_export.py
          python3 -m unittest discover -s scripts/game-quests -p test_tower_presentation.py
          python3 -m unittest discover -s scripts/game-quests -p test_unplaced_defenders.py
          python3 -m unittest discover -s scripts/game-quests -p test_reward_presentation.py
          python3 scripts/game-quests/test_spawn_region_displays.py SpawnRegionAnchorTests
          python3 -m unittest discover -s scripts/game-artwork -p test_artwork.py

      - name: Build Web (web)
        env:
          NODE_OPTIONS: --max-old-space-size=4096
        run: pnpm --filter ./web... run build
