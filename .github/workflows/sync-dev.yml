name: Sync Main to Dev

on:
  push:
    branches: [main]
concurrency:
  group: sync-main-to-dev
  cancel-in-progress: true

jobs:
  sync-dev:
    permissions:
          contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Fast-forward Dev when it has no beta-only changes
        run: |
          git fetch origin main dev
          if git merge-base --is-ancestor origin/dev origin/main; then
            git push origin refs/remotes/origin/main:refs/heads/dev
          else
            echo "Dev contains beta-only changes; automatic synchronization skipped." >> "$GITHUB_STEP_SUMMARY"
            echo "Merge main into dev explicitly after reviewing the combined beta changes." >> "$GITHUB_STEP_SUMMARY"
          fi
