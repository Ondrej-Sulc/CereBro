<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CereBro three UX iterations</title><style>
:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;color:var(--foreground,CanvasText);font:14px/1.5 var(--font-sans,system-ui),sans-serif}
.controls{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-bottom:12px}.controls label{font-size:12px;color:var(--muted-foreground,GrayText)}
select,button{min-height:40px;padding:8px 10px;border:1px solid var(--border,GrayText);border-radius:var(--radius,8px);color:var(--foreground,CanvasText);background:var(--card,Canvas);font:inherit}select{max-width:100%}button{cursor:pointer}button[aria-pressed=true]{color:var(--primary,Highlight);border-color:var(--primary,Highlight)}:focus-visible{outline:2px solid var(--ring,Highlight);outline-offset:3px}
#note{font-size:13px;color:var(--muted-foreground,GrayText);margin:0 0 12px}#metric{margin:0 0 16px}#metric p{margin:0 0 6px;font-size:12px;color:var(--muted-foreground,GrayText)}.barrow{display:grid;grid-template-columns:48px minmax(0,1fr) 58px;gap:10px;align-items:center;margin:5px 0;font-size:12px}.track{height:9px;background:var(--secondary,Canvas);border-radius:6px}.bar{display:block;height:9px;border-radius:6px;background:var(--muted-foreground,GrayText)}.bar.after{background:var(--primary,Highlight)}.barrow strong{font-weight:500;text-align:right;font-variant-numeric:tabular-nums}
.pair{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;align-items:start}.pair[hidden]{display:none}.pair.desktop,.pair.single{grid-template-columns:minmax(0,1fr)}
figure{margin:0;min-width:0;border:1px solid var(--border,GrayText);border-radius:var(--radius,8px);overflow:hidden;background:var(--card,Canvas)}figcaption{padding:8px 12px;border-bottom:1px solid var(--border,GrayText);font-weight:600}img{display:block;width:100%;height:auto}.mobile img{max-width:390px;margin-inline:auto}.fine{font-size:11px;color:var(--muted-foreground,GrayText);margin:12px 0 0}

tor · 6★ reference","w":390,"h":844},{"round":"round3","name":"06-build-unawakened","label":"Build editor · Signature zero","w":390,"h":844,"metric":"build","before":441,"after":363}];let side='both';function update(){const i=Number(document.getElementById('view').value),x=items[i];document.querySelectorAll('[data-pair]').forEach((p,n)=>{p.hidden=n!==i;p.classList.toggle('single',side!=='both');p.querySelectorAll('figure').forEach(f=>f.hidden=side!=='both'&&f.dataset.side!==side)});for(const id of ['both','before','after'])document.getElementById(id).setAttribute('aria-pressed',String(side===id));document.querySelectorAll('[data-round]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.round===x.round)));document.getElementById('note').textContent=x.round==='round1'?'Recorded damage-type counts and contact/projectile totals are preserved. Count text is larger.':x.round==='round2'?'Property chips get a full-width row where needed. Ordinary attack rows keep their height.':'Rarity, Rank and Ascension align when space permits. Signature stays full width; controls and values are preserved.';const m=document.getElementById('metric');m.hidden=!x.metric;if(x.metric){const caption=x.metric==='lines'?'Special 1 property lines':x.metric==='build'?'Build editor height':'Recorded-hit summary height',unit=x.metric==='lines'?' lines':'px',change=x.before-x.after,summary=x.metric==='lines'?'All properties retained':Math.round(change)+'px less';m.setAttribute('aria-label',caption+': before '+x.before+unit+', after '+x.after+unit);m.innerHTML='<p>'+caption+' · <strong>'+summary+'</strong></p>'+[['Before',x.before,''],['After',x.after,'after']].map(([label,v,c])=>'<div class="barrow"><span>'+label+'</span><div class="track"><span class="bar '+c+'" style="width:'+(v/x.before*100)+'%"></span></div><strong>'+v+unit+'</strong></div>').join('')}}document.getElementById('view').addEventListener('change',update);for(const id of ['both','before','after'])document.getElementById(id).addEventListener('click',()=>{side=id;update()});document.querySelectorAll('[data-round]').forEach(b=>b.addEventListener('click',()=>{document.getElementById('view').value=String(items.findIndex(x=>x.round===b.dataset.round));update()}));update();</script></body></html>
