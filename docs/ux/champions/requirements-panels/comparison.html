<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CereBro · partner requirements before and after</title><style>
:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;color:var(--foreground,CanvasText);font:14px/1.5 var(--font-sans,system-ui),sans-serif}
.controls{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-bottom:12px}.controls label{color:var(--muted-foreground,GrayText);font-size:12px}
select,button{min-height:40px;padding:8px 10px;border:1px solid var(--border,GrayText);border-radius:var(--radius,8px);color:var(--foreground,CanvasText);background:var(--card,Canvas);font:inherit}
button{cursor:pointer}button[aria-pressed=true]{border-color:var(--primary,Highlight);color:var(--primary,Highlight)}:focus-visible{outline:2px solid var(--ring,Highlight);outline-offset:3px}
#note{margin:0 0 12px;color:var(--muted-foreground,GrayText);font-size:13px}.pair{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;align-items:start}.pair[hidden]{display:none}.pair.single{grid-template-columns:minmax(0,1fr)}
figure{margin:0;min-width:0;overflow:hidden;border:1px solid var(--border,GrayText);border-radius:var(--radius,8px);background:var(--card,Canvas)}figcaption{padding:8px 12px;border-bottom:1px solid var(--border,GrayText);font-weight:600}
img{display:block;width:100%;height:auto}.mobile img{max-width:390px;margin-inline:auto}.fine{font-size:11px;color:var(--muted-foreground,GrayText);margin:12px 0 0}
.pair.desktop{grid-template-columns:minmax(0,1fr)}.density{margin:0 0 16px;font-size:12px}.density p{margin:0 0 8px;color:var(--muted-foreground,GrayText)}.barrow{display:grid;grid-template-columns:58px minmax(0,1fr) 65px;align-items:center;gap:8px;margin:5px 0}.track{height:9px;border-radius:4px;background:var(--secondary,Canvas)}.bar{display:block;height:9px;border-radius:4px;background:var(--muted-foreground,GrayText)}.bar.after{background:var(--primary,Highlight)}.barrow strong{text-align:right;font-variant-numeric:tabular-nums;font-weight:500}</style></head><body><div class="controls"><label for="view">View</label><select id="view" aria-label="Comparison view"><option value="0">Expanded requirements — mobile · 390 × 844</option><option value="1">Expanded requirements — desktop · 1280 × 900</option><option value="2">Family partner legend · 390 × 844</option><option value="3">Closed rows — mobile · 390 × 844</option><option value="4">Closed rows — desktop · 1280 × 900</option><option value="5">320px check · 320 × 568</option><option value="6">Multiple recipients · 390 × 844</option><option value="7">Leveled family — desktop · 1280 × 900</option><option value="8">Leveled family — mobile · 390 × 844</option><option value="9">Wide desktop · 1600 × 900</option></select><button id="both" aria-pressed="true">Both versions</button><button id="before" aria-pressed="false">Before only</button><button id="after" aria-pressed="false">After only</button></div><p id="note"></p>
<section class="pair mobile" data-pair="0" ><figure data-side="before"><figcaption>Before</figcaption><img src="before/04-reference-requirements.png" alt="Expanded requirements — mobile, before, 390 × 844"></figure><figure data-side="after"><figcaption>After</figcaption><img src="after/04-reference-requirements.png" alt="Expanded requirements — mobile, after, 390 × 844"></figure></section>

<section class="pair mobile" data-pair="2" hidden><figure data-side="before"><figcaption>Before</figcaption><img src="before/10-family-requirements.png" alt="Family partner legend, before, 390 × 844"></figure><figure data-side="after"><figcaption>After</figcaption><img src="after/10-family-requirements.png" alt="Family partner legend, after, 390 × 844"></figure></section>

<section class="pair mobile" data-pair="6" hidden><figure data-side="before"><figcaption>Before</figcaption><img src="before/05-multiple-recipients.png" alt="Multiple recipients, before, 390 × 844"></figure><figure data-side="after"><figcaption>After</figcaption><img src="after/05-multiple-recipients.png" alt="Multiple recipients, after, 390 × 844"></figure></section>

<section class="pair desktop" data-pair="9" hidden><figure data-side="before"><figcaption>Before</figcaption><img src="before/08-reference-wide.png" alt="Wide desktop, before, 1600 × 900"></figure><figure data-side="after"><figcaption>After</figcaption><img src="after/08-reference-wide.png" alt="Wide desktop, after, 1600 × 900"></figure></section>
<p class="fine">Real matched screenshots at 100% browser zoom and DPR 1. Complete bonuses, exact rule pairings, partner destinations and native icons are preserved. Expanded panels offer full-name links; Escape returns focus to the row arrow. Closed rows retain their dimensions.</p><script>
const notes=["Partner names and exact star ranges are aligned. Full names open champion pages.","A two-column layout makes the partner options easier to scan.","Named partner links are available in the legend; exact stars remain with each original level.","The compact default list keeps its existing size, icons and complete descriptions.","All six reference synergies still fit at 100% browser zoom.","The narrow layout retains native icons, readable labels and complete bonus text.","Recipient conditions and stacking notes remain intact.","Each level retains its full bonus, exact partner stars and original catalog target.","The compact level comparison is preserved.","Native synergy glyphs and compact row geometry remain unchanged."];const select=document.getElementById('view');function update(){document.querySelectorAll('[data-pair]').forEach(el=>el.hidden=el.dataset.pair!==select.value);document.getElementById('note').textContent=notes[Number(select.value)]}
select.addEventListener('change',update);for(const mode of ['both','before','after'])document.getElementById(mode).onclick=()=>{for(const m of ['both','before','after'])document.getElementById(m).setAttribute('aria-pressed',String(m===mode));document.querySelectorAll('[data-side=before]').forEach(el=>el.style.display=mode==='after'?'none':'');document.querySelectorAll('[data-side=after]').forEach(el=>el.style.display=mode==='before'?'none':'');document.querySelectorAll('[data-pair]').forEach(el=>el.classList.toggle('single',mode!=='both'))};update();
</script></body></html>
