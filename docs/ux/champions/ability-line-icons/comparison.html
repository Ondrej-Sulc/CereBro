<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CereBro full abilities comparison</title><style>
*{box-sizing:border-box}body{margin:0;color:var(--foreground);font-family:var(--font-sans,system-ui,sans-serif)}
.controls{display:flex;align-items:center;flex-wrap:wrap;gap:10px;margin-bottom:10px}label{font-size:12px;color:var(--muted-foreground)}
select,button{font:inherit;font-size:13px;border:1px solid var(--border);border-radius:var(--radius);padding:8px 10px;color:var(--foreground);background:var(--card)}select{max-width:100%}
button{cursor:pointer}button[aria-pressed=true]{color:var(--primary-foreground);background:var(--primary);border-color:var(--primary)}
button:focus-visible,select:focus-visible{outline:2px solid var(--ring);outline-offset:3px}.modes{display:flex;gap:4px}.meta{font-size:12px;color:var(--muted-foreground);margin:0 0 10px;line-height:1.6}
.bars{display:grid;grid-template-columns:44px minmax(0,1fr) 68px;gap:5px 8px;max-width:380px;font-size:11px;margin:0 0 16px;align-items:center}.track{background:var(--secondary);border-radius:4px;height:6px;overflow:hidden}.fill{height:6px;border-radius:4px;background:var(--primary)}.beforeFill{background:var(--muted-foreground);opacity:.5}.measure{color:var(--muted-foreground);font-variant-numeric:tabular-nums;text-align:right}
.pair{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));align-items:start;gap:12px}.pair.single{grid-template-columns:minmax(0,1fr)}figure{margin:0;min-width:0}figcaption{font-size:13px;font-weight:600;margin-bottom:8px}
.shot{overflow:auto;max-height:960px;border:1px solid var(--border);border-radius:var(--radius)}img{display:block;width:100%;height:auto}.actual img{width:auto;max-width:none}
[hidden]{display:none!important}@media(max-width:540px){.pair{grid-template-columns:1fr}.modes{flex-wrap:wrap}}
</style></head><body>
<div class="controls"><label for="scene">View</label><select id="scene" aria-label="Screenshot comparison"></select><div class="modes" role="group" aria-label="Compare"><button type="button" data-mode="both" aria-pressed="true">Both</button><button type="button" data-mode="before" aria-pressed="false">Before</button><button type="button" data-mode="after" aria-pressed="false">After</button></div><button type="button" id="scale" aria-pressed="false">Actual size</button></div>
<p class="meta" id="meta"></p><div class="bars" role="img" id="heightChart" aria-label="Ability card height comparison"><span>Before</span><div class="track"><div class="fill beforeFill" id="beforeBar"></div></div><span class="measure" id="beforeHeight"></span><span>After</span><div class="track"><div class="fill" id="afterBar"></div></div><span class="measure" id="afterHeight"></span></div>
<section class="pair" data-scene="0" hidden><figure data-stage="before"><figcaption>Before</figcaption><div class="shot"><img src="./before/01-overseer-special2-desktop.png" alt="Special 2 · desktop before inline effect icons"></div></figure><figure data-stage="after"><figcaption>After</figcaption><div class="shot"><img src="./after/01-overseer-special2-desktop.png" alt="Special 2 · desktop after inline effect icons"></div></figure></section>
<section class="pair" data-scene="1"><figure data-stage="before"><figcaption>Before</figcaption><div class="shot"><img src="./before/02-overseer-special2-mobile.png" alt="Special 2 · mobile before inline effect icons"></div></figure><figure data-stage="after"><figcaption>After</figcaption><div class="shot"><img src="./after/02-overseer-special2-mobile.png" alt="Special 2 · mobile after inline effect icons"></div></figure></section>
<section class="pair" data-scene="2" hidden><figure data-stage="before"><figcaption>Before</figcaption><div class="shot"><img src="./before/03-overseer-special2-small.png" alt="Special 2 · narrow screen before inline effect icons"></div></figure><figure data-stage="after"><figcaption>After</figcaption><div class="shot"><img src="./after/03-overseer-special2-small.png" alt="Special 2 · narrow screen after inline effect icons"></div></figure></section>
<section class="pair" data-scene="3" hidden><figure data-stage="before"><figcaption>Before</figcaption><div class="shot"><img src="./before/04-overseer-base-desktop.png" alt="Context headings · desktop before inline effect icons"></div></figure><figure data-stage="after"><figcaption>After</figcaption><div class="shot"><img src="./after/04-overseer-base-desktop.png" alt="Context headings · desktop after inline effect icons"></div></figure></section>
<section class="pair" data-scene="4" hidden><figure data-stage="before"><figcaption>Before</figcaption><div class="shot"><img src="./before/05-absorbing-base-mobile.png" alt="Context headings · mobile before inline effect icons"></div></figure><figure data-stage="after"><figcaption>After</figcaption><div class="shot"><img src="./after/05-absorbing-base-mobile.png" alt="Context headings · mobile after inline effect icons"></div></figure></section>
<script>
const cases=[{"name":"01-overseer-special2-desktop","slug":"the-overseer","chapter":"special2","width":1280,"height":900,"title":"Special 2 · desktop","beforeHeight":323,"afterHeight":236},{"name":"02-overseer-special2-mobile","slug":"the-overseer","chapter":"special2","width":390,"height":844,"title":"Special 2 · mobile","beforeHeight":506.5,"afterHeight":427.5},{"name":"03-overseer-special2-small","slug":"the-overseer","chapter":"special2","width":320,"height":568,"title":"Special 2 · narrow screen","beforeHeight":608.5,"afterHeight":555},{"name":"04-overseer-base-desktop","slug":"the-overseer","chapter":"base","width":1280,"height":900,"title":"Context headings · desktop","beforeHeight":875.5,"afterHeight":875.5},{"name":"05-absorbing-base-mobile","slug":"absorbing-man","chapter":"base","width":390,"height":844,"title":"Context headings · mobile","beforeHeight":2770,"afterHeight":2770}],scene=document.getElementById('scene');let mode='both',actual=false;
for(const [i,c]of cases.entries()){const option=document.createElement('option');option.value=i;option.textContent=c.title+' · '+c.width+'px';scene.append(option)}scene.value='1';
function show(){const c=cases[Number(scene.value)];document.querySelectorAll('[data-scene]').forEach((panel,i)=>{panel.hidden=i!==Number(scene.value);panel.classList.toggle('single',mode!=='both');panel.classList.toggle('actual',actual);panel.querySelector('[data-stage=before]').hidden=mode==='after';panel.querySelector('[data-stage=after]').hidden=mode==='before'});document.getElementById('meta').textContent=(c.slug==='absorbing-man'?'Absorbing Man':'The Overseer')+' · 7★ R6 · Sig 200 · '+c.width+' × '+c.height+' · card height';const max=Math.max(c.beforeHeight,c.afterHeight);document.getElementById('beforeBar').style.width=(100*c.beforeHeight/max)+'%';document.getElementById('afterBar').style.width=(100*c.afterHeight/max)+'%';document.getElementById('beforeHeight').textContent=c.beforeHeight+'px';document.getElementById('afterHeight').textContent=c.afterHeight+'px';document.getElementById('heightChart').setAttribute('aria-label','Ability card height: before '+c.beforeHeight+' pixels, after '+c.afterHeight+' pixels')}
scene.addEventListener('change',show);document.querySelectorAll('[data-mode]').forEach(b=>b.addEventListener('click',()=>{mode=b.dataset.mode;document.querySelectorAll('[data-mode]').forEach(x=>x.setAttribute('aria-pressed',String(x===b)));show()}));document.getElementById('scale').addEventListener('click',function(){actual=!actual;this.setAttribute('aria-pressed',String(actual));show()});show();
</script></body></html>
