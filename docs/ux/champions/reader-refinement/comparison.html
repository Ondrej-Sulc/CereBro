<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CereBro ability reader comparison</title><style>
:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;color:var(--foreground,CanvasText);font:14px/1.5 var(--font-sans,system-ui),sans-serif}
.controls{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-bottom:12px}.controls label{font-size:12px;color:var(--muted-foreground,GrayText)}
select,button{min-height:40px;padding:8px 10px;border:1px solid var(--border,GrayText);border-radius:var(--radius,8px);color:var(--foreground,CanvasText);background:var(--card,Canvas);font:inherit}select{max-width:100%}button{cursor:pointer}button[aria-pressed=true]{color:var(--primary,Highlight);border-color:var(--primary,Highlight)}:focus-visible{outline:2px solid var(--ring,Highlight);outline-offset:3px}
#note{font-size:13px;color:var(--muted-foreground,GrayText);margin:0 0 12px}#metric{margin:0 0 16px}#metric p{margin:0 0 6px;font-size:12px;color:var(--muted-foreground,GrayText)}.barrow{display:grid;grid-template-columns:48px minmax(0,1fr) 58px;gap:10px;align-items:center;margin:5px 0;font-size:12px}.track{height:9px;background:var(--secondary,Canvas);border-radius:6px}.bar{display:block;height:9px;border-radius:6px;background:var(--muted-foreground,GrayText)}.bar.after{background:var(--primary,Highlight)}.barrow strong{font-weight:500;text-align:right;font-variant-numeric:tabular-nums}
.pair{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;align-items:start}.pair[hidden]{display:none}.pair.desktop,.pair.single{grid-template-columns:minmax(0,1fr)}
figure{margin:0;min-width:0;border:1px solid var(--border,GrayText);border-radius:var(--radius,8px);overflow:hidden;background:var(--card,Canvas)}figcaption{padding:8px 12px;border-bottom:1px solid var(--border,GrayText);font-weight:600}img{display:block;width:100%;height:auto}.mobile img{max-width:390px;margin-inline:auto}.fine{font-size:11px;color:var(--muted-foreground,GrayText);margin:12px 0 0}
</style></head><body>

<script>const items=[{"name":"03-mobile-base","label":"Scoped reader · mobile","w":390,"h":844,"metric":"entry","before":482.6875,"after":409.6875},{"name":"06-mobile-group-transition","label":"Group transition · mobile","w":390,"h":844,"metric":"gap","before":82,"after":51},{"name":"04-desktop-base","label":"Scoped reader · desktop","w":1280,"h":900,"metric":"entry","before":402.390625,"after":305.390625},{"name":"07-desktop-group-transition","label":"Group transition · desktop","w":1280,"h":900,"metric":"gap","before":94,"after":55},{"name":"05-small-base","label":"Scoped reader · 320px","w":320,"h":568,"metric":"entry","before":557.6875,"after":456.6875},{"name":"08-linked-passage","label":"Linked passage","w":390,"h":844},{"name":"09-unawakened","label":"Signature zero","w":390,"h":844},{"name":"10-sparse-signature","label":"Ms. Marvel · signature","w":390,"h":844},{"name":"11-long-name-base","label":"Star-Lord (Kitty Pryde) · base","w":390,"h":844,"metric":"entry","before":482.6875,"after":409.6875},{"name":"12-scoped-no-results","label":"Scoped search · no results","w":390,"h":844},{"name":"01-mobile-all","label":"All abilities · mobile","w":390,"h":844},{"name":"02-desktop-all","label":"All abilities · desktop","w":1280,"h":900},{"name":"13-biography","label":"Biography","w":390,"h":844}];let side='both';function update(){const i=Number(document.getElementById('view').value),x=items[i];document.querySelectorAll('[data-pair]').forEach((p,n)=>{p.hidden=n!==i;p.classList.toggle('single',side!=='both');p.querySelectorAll('figure').forEach(f=>f.hidden=side!=='both'&&f.dataset.side!==side)});for(const id of ['both','before','after'])document.getElementById(id).setAttribute('aria-pressed',String(side===id));document.getElementById('note').textContent=x.metric==='gap'?'One divider between groups. Paragraph spacing, size and width are unchanged.':x.metric==='entry'?'Chapter scope and Search all abilities share the search controls. Complete text appears sooner.':'Complete descriptions, original passage IDs and glossary/value controls are preserved.';const m=document.getElementById('metric');m.hidden=!x.metric;if(x.metric){const caption=x.metric==='gap'?'Space between the last passage of one group and the first of the next':'Section start to first ability passage';const change=Math.round(x.before-x.after);m.setAttribute('aria-label',caption+': before '+Math.round(x.before)+' pixels, after '+Math.round(x.after)+' pixels');m.innerHTML='<p>'+caption+' · <strong>'+change+'px less</strong></p>'+[['Before',x.before,''],['After',x.after,'after']].map(([label,v,c])=>'<div class="barrow"><span>'+label+'</span><div class="track"><span class="bar '+c+'" style="width:'+(v/x.before*100)+'%"></span></div><strong>'+Math.round(v).toLocaleString('en-US')+'px</strong></div>').join('')}}document.getElementById('view').addEventListener('change',update);for(const id of ['both','before','after'])document.getElementById(id).addEventListener('click',()=>{side=id;update()});update();</script></body></html>
