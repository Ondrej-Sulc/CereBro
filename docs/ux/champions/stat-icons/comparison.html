<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CereBro stat icons comparison</title><style>
*{box-sizing:border-box}body{margin:0;color:var(--foreground);font-family:var(--font-sans,system-ui,sans-serif)}
.controls{display:flex;align-items:center;flex-wrap:wrap;gap:10px;margin-bottom:12px}
label{font-size:12px;color:var(--muted-foreground)}select,button{font:inherit;font-size:13px;border:1px solid var(--border);border-radius:var(--radius);padding:8px 10px;color:var(--foreground);background:var(--card)}
select{max-width:100%}button{cursor:pointer}button[aria-pressed=true]{color:var(--primary-foreground);background:var(--primary);border-color:var(--primary)}
button:focus-visible,select:focus-visible{outline:2px solid var(--ring);outline-offset:3px}
.modes{display:flex;gap:4px}.meta{font-size:12px;color:var(--muted-foreground);margin:0 0 12px;line-height:1.6}
.pair{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));align-items:start;gap:12px}.pair.single{grid-template-columns:minmax(0,1fr)}
figure{margin:0;min-width:0}figcaption{font-size:13px;font-weight:600;margin-bottom:8px}
.shot{overflow:auto;max-height:960px;border:1px solid var(--border);border-radius:var(--radius)}
img{display:block;width:100%;height:auto}.actual img{width:auto;max-width:none}
[hidden]{display:none!important}a{color:var(--primary)}
@media(max-width:540px){.pair{grid-template-columns:1fr}.modes{flex-wrap:wrap}}
</style></head><body>
<div class="controls"><label for="scene">View</label><select id="scene" aria-label="Screenshot comparison"></select>
<div class="modes" role="group" aria-label="Compare"><button type="button" data-mode="both" aria-pressed="true">Both</button><button type="button" data-mode="before" aria-pressed="false">Before</button><button type="button" data-mode="after" aria-pressed="false">After</button></div>
<button type="button" id="scale" aria-pressed="false">Actual size</button></div>
<p id="meta" class="meta"></p>
<section class="pair" data-scene="0"><figure data-stage="before"><figcaption>Before</figcaption><div class="shot"><img src="./before/01-stats-mobile.png" alt="Combat ratings · mobile before native stat icons"></div></figure><figure data-stage="after"><figcaption>After · native game icons</figcaption><div class="shot"><img src="./after/01-stats-mobile.png" alt="Combat ratings · mobile with native stat icons"></div></figure></section>
<section class="pair" data-scene="1" hidden><figure data-stage="before"><figcaption>Before</figcaption><div class="shot"><img src="./before/02-stats-desktop.png" alt="Combat ratings · desktop before native stat icons"></div></figure><figure data-stage="after"><figcaption>After · native game icons</figcaption><div class="shot"><img src="./after/02-stats-desktop.png" alt="Combat ratings · desktop with native stat icons"></div></figure></section>
<section class="pair" data-scene="2" hidden><figure data-stage="before"><figcaption>Before</figcaption><div class="shot"><img src="./before/03-stats-small.png" alt="Combat ratings · narrow screen before native stat icons"></div></figure><figure data-stage="after"><figcaption>After · native game icons</figcaption><div class="shot"><img src="./after/03-stats-small.png" alt="Combat ratings · narrow screen with native stat icons"></div></figure></section>
<section class="pair" data-scene="3" hidden><figure data-stage="before"><figcaption>Before</figcaption><div class="shot"><img src="./before/04-hero-mobile.png" alt="Health & Attack · mobile before native stat icons"></div></figure><figure data-stage="after"><figcaption>After · native game icons</figcaption><div class="shot"><img src="./after/04-hero-mobile.png" alt="Health & Attack · mobile with native stat icons"></div></figure></section>
<section class="pair" data-scene="4" hidden><figure data-stage="before"><figcaption>Before</figcaption><div class="shot"><img src="./before/05-hero-desktop.png" alt="Health & Attack · desktop before native stat icons"></div></figure><figure data-stage="after"><figcaption>After · native game icons</figcaption><div class="shot"><img src="./after/05-hero-desktop.png" alt="Health & Attack · desktop with native stat icons"></div></figure></section>
<section class="pair" data-scene="5" hidden><figure data-stage="before"><figcaption>Before</figcaption><div class="shot"><img src="./before/06-hero-small-long.png" alt="Health & Attack · long name before native stat icons"></div></figure><figure data-stage="after"><figcaption>After · native game icons</figcaption><div class="shot"><img src="./after/06-hero-small-long.png" alt="Health & Attack · long name with native stat icons"></div></figure></section>
<section class="pair" data-scene="6" hidden><figure data-stage="before"><figcaption>Before</figcaption><div class="shot"><img src="./before/07-stats-long.png" alt="Ratings · Star-Lord (Kitty Pryde) before native stat icons"></div></figure><figure data-stage="after"><figcaption>After · native game icons</figcaption><div class="shot"><img src="./after/07-stats-long.png" alt="Ratings · Star-Lord (Kitty Pryde) with native stat icons"></div></figure></section>
<section class="pair" data-scene="7" hidden><figure data-stage="before"><figcaption>Before</figcaption><div class="shot"><img src="./before/08-stats-six-star.png" alt="Ratings · Ms. Marvel before native stat icons"></div></figure><figure data-stage="after"><figcaption>After · native game icons</figcaption><div class="shot"><img src="./after/08-stats-six-star.png" alt="Ratings · Ms. Marvel with native stat icons"></div></figure></section><script>
const cases=[{"name":"01-stats-mobile","width":390,"height":844,"slug":"absorbing-man","rarity":7,"rank":6,"target":"stats","title":"Combat ratings · mobile"},{"name":"02-stats-desktop","width":1280,"height":900,"slug":"absorbing-man","rarity":7,"rank":6,"target":"stats","title":"Combat ratings · desktop"},{"name":"03-stats-small","width":320,"height":568,"slug":"absorbing-man","rarity":7,"rank":6,"target":"stats","title":"Combat ratings · narrow screen"},{"name":"04-hero-mobile","width":390,"height":844,"slug":"absorbing-man","rarity":7,"rank":6,"target":"hero","title":"Health & Attack · mobile"},{"name":"05-hero-desktop","width":1280,"height":900,"slug":"absorbing-man","rarity":7,"rank":6,"target":"hero","title":"Health & Attack · desktop"},{"name":"06-hero-small-long","width":320,"height":568,"slug":"star-lord-kitty-pryde","rarity":7,"rank":6,"target":"hero","title":"Health & Attack · long name"},{"name":"07-stats-long","width":390,"height":844,"slug":"star-lord-kitty-pryde","rarity":7,"rank":6,"target":"stats","title":"Ratings · Star-Lord (Kitty Pryde)"},{"name":"08-stats-six-star","width":390,"height":844,"slug":"ms-marvel","rarity":6,"rank":5,"target":"stats","title":"Ratings · Ms. Marvel"}],scene=document.getElementById('scene'),meta=document.getElementById('meta');let mode='both',actual=false;
for(const [i,c]of cases.entries()){const option=document.createElement('option');option.value=i;option.textContent=c.title+' · '+c.width+'px';scene.append(option)}
function show(){const c=cases[Number(scene.value)];document.querySelectorAll('[data-scene]').forEach((panel,i)=>{panel.hidden=i!==Number(scene.value);panel.classList.toggle('single',mode!=='both');panel.classList.toggle('actual',actual);panel.querySelector('[data-stage=before]').hidden=mode==='after';panel.querySelector('[data-stage=after]').hidden=mode==='before'});meta.textContent=(c.slug==='absorbing-man'?'Absorbing Man':c.slug==='ms-marvel'?'Ms. Marvel':'Star-Lord (Kitty Pryde)')+' · '+c.rarity+'★ R'+c.rank+' · Sig 200 · '+c.width+' × '+c.height}
scene.addEventListener('change',show);document.querySelectorAll('[data-mode]').forEach(b=>b.addEventListener('click',()=>{mode=b.dataset.mode;document.querySelectorAll('[data-mode]').forEach(x=>x.setAttribute('aria-pressed',String(x===b)));show()}));document.getElementById('scale').addEventListener('click',function(){actual=!actual;this.setAttribute('aria-pressed',String(actual));show()});show();
</script></body></html>
