<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CereBro · synergy card comparison</title><style>
:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;color:var(--foreground,CanvasText);font:14px/1.5 var(--font-sans,system-ui),sans-serif}
.controls{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-bottom:12px}.controls label{color:var(--muted-foreground,GrayText);font-size:12px}
select,button{min-height:40px;padding:8px 10px;border:1px solid var(--border,GrayText);border-radius:var(--radius,8px);color:var(--foreground,CanvasText);background:var(--card,Canvas);font:inherit}
button{cursor:pointer}button[aria-pressed=true]{border-color:var(--primary,Highlight);color:var(--primary,Highlight)}:focus-visible{outline:2px solid var(--ring,Highlight);outline-offset:3px}
#note{margin:0 0 12px;color:var(--muted-foreground,GrayText);font-size:13px}.pair{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;align-items:start}.pair[hidden]{display:none}.pair.single{grid-template-columns:minmax(0,1fr)}
figure{margin:0;min-width:0;overflow:hidden;border:1px solid var(--border,GrayText);border-radius:var(--radius,8px);background:var(--card,Canvas)}figcaption{padding:8px 12px;border-bottom:1px solid var(--border,GrayText);font-weight:600}
img{display:block;width:100%;height:auto}.mobile img{max-width:390px;margin-inline:auto}.fine{font-size:11px;color:var(--muted-foreground,GrayText);margin:12px 0 0}
</style></head><body><div class="controls"><label for="view">View</label><select id="view" aria-label="Comparison view"><option value="0">Partners and bonus · 390 × 844</option><option value="1">Leveled family · 390 × 844</option><option value="2">Recipients and uniqueness · 390 × 844</option><option value="3">Expanded requirements · 390 × 844</option><option value="4">Desktop cards · 1280 × 900</option><option value="5">Desktop level comparison · 1280 × 900</option><option value="6">Small-screen card · 320 × 568</option><option value="7">Small-screen levels · 320 × 568</option></select><button id="both" aria-pressed="true">Side by side</button><button id="before" aria-pressed="false">Before only</button><button id="after" aria-pressed="false">After only</button></div><p id="note"></p>
<section class="pair mobile" data-pair="0" ><figure data-side="before"><figcaption>Before this pass</figcaption><img src="before/02-mobile-partners.png" alt="Partners and bonus, before, 390 × 844"></figure><figure data-side="after"><figcaption>After</figcaption><img src="after/02-mobile-partners.png" alt="Partners and bonus, after, 390 × 844"></figure></section>
<section class="pair mobile" data-pair="1" hidden><figure data-side="before"><figcaption>Before this pass</figcaption><img src="before/06-mobile-levels.png" alt="Leveled family, before, 390 × 844"></figure><figure data-side="after"><figcaption>After</figcaption><img src="after/06-mobile-levels.png" alt="Leveled family, after, 390 × 844"></figure></section>
<section class="pair mobile" data-pair="2" hidden><figure data-side="before"><figcaption>Before this pass</figcaption><img src="before/03-mobile-bonuses.png" alt="Recipients and uniqueness, before, 390 × 844"></figure><figure data-side="after"><figcaption>After</figcaption><img src="after/03-mobile-bonuses.png" alt="Recipients and uniqueness, after, 390 × 844"></figure></section>
<section class="pair mobile" data-pair="3" hidden><figure data-side="before"><figcaption>Before this pass</figcaption><img src="before/04-mobile-requirements.png" alt="Expanded requirements, before, 390 × 844"></figure><figure data-side="after"><figcaption>After</figcaption><img src="after/04-mobile-requirements.png" alt="Expanded requirements, after, 390 × 844"></figure></section>
<section class="pair" data-pair="4" hidden><figure data-side="before"><figcaption>Before this pass</figcaption><img src="before/01-desktop-partners.png" alt="Desktop cards, before, 1280 × 900"></figure><figure data-side="after"><figcaption>After</figcaption><img src="after/01-desktop-partners.png" alt="Desktop cards, after, 1280 × 900"></figure></section>
<section class="pair" data-pair="5" hidden><figure data-side="before"><figcaption>Before this pass</figcaption><img src="before/05-desktop-levels.png" alt="Desktop level comparison, before, 1280 × 900"></figure><figure data-side="after"><figcaption>After</figcaption><img src="after/05-desktop-levels.png" alt="Desktop level comparison, after, 1280 × 900"></figure></section>
<section class="pair mobile" data-pair="6" hidden><figure data-side="before"><figcaption>Before this pass</figcaption><img src="before/07-small-partners.png" alt="Small-screen card, before, 320 × 568"></figure><figure data-side="after"><figcaption>After</figcaption><img src="after/07-small-partners.png" alt="Small-screen card, after, 320 × 568"></figure></section>
<section class="pair mobile" data-pair="7" hidden><figure data-side="before"><figcaption>Before this pass</figcaption><img src="before/08-small-levels.png" alt="Small-screen levels, before, 320 × 568"></figure><figure data-side="after"><figcaption>After</figcaption><img src="after/08-small-levels.png" alt="Small-screen levels, after, 320 × 568"></figure></section>
<p class="fine">Real screenshots from the same local Chromium setup, signed out, DPR 1. Cards align below persistent navigation; viewport and build match within each pair. Use Before only / After only to inspect desktop captures at full width.</p><script>
const notes=["A clearer title → partners → bonus hierarchy; star requirements have their own disclosure row.","Level badges and explicit partner-star labels keep each requirement tied to its complete bonus.","Stronger recipient headings and a quick Unique badge; full stacking text remains below.","Exact named star requirements remain available through the keyboard-accessible disclosure.","Calmer partner surfaces, clearer bonus sections and consistent requirements rows.","The family keeps all original levels, amounts, star ranges and source destinations.","Labels and full partner names wrap within the narrow card.","A narrow-screen check of per-level stars and bonus text."];const select=document.getElementById('view');function update(){document.querySelectorAll('[data-pair]').forEach(el=>el.hidden=el.dataset.pair!==select.value);document.getElementById('note').textContent=notes[Number(select.value)]}
select.addEventListener('change',update);for(const mode of ['both','before','after'])document.getElementById(mode).onclick=()=>{for(const m of ['both','before','after'])document.getElementById(m).setAttribute('aria-pressed',String(m===mode));document.querySelectorAll('[data-side=before]').forEach(el=>el.style.display=mode==='after'?'none':'');document.querySelectorAll('[data-side=after]').forEach(el=>el.style.display=mode==='before'?'none':'');document.querySelectorAll('[data-pair]').forEach(el=>el.classList.toggle('single',mode!=='both'))};update();
</script></body></html>
