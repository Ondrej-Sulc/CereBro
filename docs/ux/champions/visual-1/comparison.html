<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CereBro · visual comparison</title><style>
:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;color:var(--foreground,CanvasText);font:14px/1.5 var(--font-sans,system-ui),sans-serif}
.controls{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-bottom:12px}.controls label{color:var(--muted-foreground,GrayText);font-size:12px}
select,button{min-height:40px;padding:8px 10px;border:1px solid var(--border,GrayText);border-radius:var(--radius,8px);color:var(--foreground,CanvasText);background:var(--card,Canvas);font:inherit}
button{cursor:pointer}button[aria-pressed=true]{border-color:var(--primary,Highlight);color:var(--primary,Highlight)}:focus-visible{outline:2px solid var(--ring,Highlight);outline-offset:3px}
#note{margin:0 0 12px;color:var(--muted-foreground,GrayText);font-size:13px}.pair{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;align-items:start}.pair[hidden]{display:none}.pair.single{grid-template-columns:minmax(0,1fr)}
figure{margin:0;min-width:0;overflow:hidden;border:1px solid var(--border,GrayText);border-radius:var(--radius,8px);background:var(--card,Canvas)}figcaption{padding:8px 12px;border-bottom:1px solid var(--border,GrayText);font-weight:600}
img{display:block;width:100%;height:auto}.mobile img{max-width:390px;margin-inline:auto}.fine{font-size:11px;color:var(--muted-foreground,GrayText);margin:12px 0 0}
</style></head><body><div class="controls"><label for="view">View</label><select id="view" aria-label="Comparison view"><option value="0">Mobile overview · 390 × 844</option><option value="1">Desktop hero · 1280 × 800</option><option value="2">Desktop overview · 1280 × 800</option><option value="3">Mobile hero · 390 × 844</option><option value="4">Small-screen check · 320 × 568</option><option value="5">Long-name check · 320 × 568</option><option value="6">Sparse-kit check · 390 × 844</option></select><button id="both" aria-pressed="true">Side by side</button><button id="before" aria-pressed="false">Before only</button><button id="after" aria-pressed="false">After only</button></div><p id="note"></p>
<section class="pair mobile" data-pair="0" ><figure data-side="before"><figcaption>Before this pass</figcaption><img src="before/04-mobile-overview.png" alt="Mobile overview, before, 390 × 844"></figure><figure data-side="after"><figcaption>After</figcaption><img src="after/04-mobile-overview.png" alt="Mobile overview, after, 390 × 844"></figure></section>
<section class="pair" data-pair="1" hidden><figure data-side="before"><figcaption>Before this pass</figcaption><img src="before/01-desktop-landing.png" alt="Desktop hero, before, 1280 × 800"></figure><figure data-side="after"><figcaption>After</figcaption><img src="after/01-desktop-landing.png" alt="Desktop hero, after, 1280 × 800"></figure></section>
<section class="pair" data-pair="2" hidden><figure data-side="before"><figcaption>Before this pass</figcaption><img src="before/02-desktop-overview.png" alt="Desktop overview, before, 1280 × 800"></figure><figure data-side="after"><figcaption>After</figcaption><img src="after/02-desktop-overview.png" alt="Desktop overview, after, 1280 × 800"></figure></section>
<section class="pair mobile" data-pair="3" hidden><figure data-side="before"><figcaption>Before this pass</figcaption><img src="before/03-mobile-landing.png" alt="Mobile hero, before, 390 × 844"></figure><figure data-side="after"><figcaption>After</figcaption><img src="after/03-mobile-landing.png" alt="Mobile hero, after, 390 × 844"></figure></section>
<section class="pair mobile" data-pair="4" hidden><figure data-side="before"><figcaption>Before this pass</figcaption><img src="before/05-small-mobile.png" alt="Small-screen check, before, 320 × 568"></figure><figure data-side="after"><figcaption>After</figcaption><img src="after/05-small-mobile.png" alt="Small-screen check, after, 320 × 568"></figure></section>
<section class="pair mobile" data-pair="5" hidden><figure data-side="before"><figcaption>Before this pass</figcaption><img src="before/06-long-name.png" alt="Long-name check, before, 320 × 568"></figure><figure data-side="after"><figcaption>After</figcaption><img src="after/06-long-name.png" alt="Long-name check, after, 320 × 568"></figure></section>
<section class="pair mobile" data-pair="6" hidden><figure data-side="before"><figcaption>Before this pass</figcaption><img src="before/07-sparse-overview.png" alt="Sparse-kit check, before, 390 × 844"></figure><figure data-side="after"><figcaption>After</figcaption><img src="after/07-sparse-overview.png" alt="Sparse-kit check, after, 390 × 844"></figure></section>
<p class="fine">Real screenshots from the same local Chromium setup, signed out, DPR 1. Viewport sizes and champion builds match. Overview pairs align the reading location. Use Before only / After only to inspect desktop screenshots at full width.</p><script>
const notes=["A tighter heading/control row and clearer effect-card headers expose more source content.","A quieter wordmark, clearer artwork and a shorter hero bring the kit into view.","Slimmer navigation, wider protection cards and subtle effect-color accents.","Smaller identity framing and grouped metrics keep the title and artwork readable.","The narrow layout retains whole-word names and separate metric values.","Abomination (Immortal): full name and variant remain visible.","Ms. Marvel: the same hierarchy adapts to a smaller kit."];const select=document.getElementById('view');function update(){document.querySelectorAll('[data-pair]').forEach(el=>el.hidden=el.dataset.pair!==select.value);document.getElementById('note').textContent=notes[Number(select.value)]}
select.addEventListener('change',update);for(const mode of ['both','before','after'])document.getElementById(mode).onclick=()=>{for(const m of ['both','before','after'])document.getElementById(m).setAttribute('aria-pressed',String(m===mode));document.querySelectorAll('[data-side=before]').forEach(el=>el.style.display=mode==='after'?'none':'');document.querySelectorAll('[data-side=after]').forEach(el=>el.style.display=mode==='before'?'none':'');document.querySelectorAll('[data-pair]').forEach(el=>el.classList.toggle('single',mode!=='both'))};update();
</script></body></html>
