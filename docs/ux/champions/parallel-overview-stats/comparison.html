<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CereBro champion UX comparison</title><style>

<script>const items=[{"name":"01-kit-protections-mobile","label":"Detailed protections · mobile","w":390,"h":844,"metric":"kit","before":2506.5,"after":2089.5},{"name":"09-stats-mobile","label":"Combat ratings · mobile","w":390,"h":844,"metric":"stats","before":931.09375,"after":673.78125},{"name":"02-kit-protections-desktop","label":"Detailed protections · desktop","w":1280,"h":900,"metric":"kit","before":2670.5,"after":2205.5},{"name":"08-stats-desktop","label":"Combat ratings · desktop","w":1280,"h":900,"metric":"stats","before":492.796875,"after":358.890625},{"name":"03-kit-protections-small","label":"Detailed protections · 320px","w":320,"h":568,"metric":"kit","before":3058.5,"after":2495.5},{"name":"10-stats-small","label":"Combat ratings · 320px","w":320,"h":568,"metric":"stats","before":951.09375,"after":693.78125},{"name":"04-kit-long-name","label":"Star-Lord (Kitty Pryde) · effects","w":390,"h":844},{"name":"11-stats-long-name","label":"Star-Lord (Kitty Pryde) · ratings","w":390,"h":844,"metric":"stats","before":931.09375,"after":673.78125},{"name":"05-kit-sparse","label":"Ms. Marvel · protections","w":390,"h":844},{"name":"12-stats-sparse","label":"Ms. Marvel · ratings","w":390,"h":844,"metric":"stats","before":931.09375,"after":673.78125},{"name":"06-kit-split-wide","label":"Gains / Inflicts · wide desktop","w":1536,"h":900},{"name":"07-kit-compact-control","label":"Compact mode · unchanged","w":390,"h":844}];let side='both';function update(){const i=Number(document.getElementById('view').value),x=items[i];document.querySelectorAll('[data-pair]').forEach((p,n)=>{p.hidden=n!==i;p.classList.toggle('single',side!=='both');p.querySelectorAll('figure').forEach(f=>f.hidden=side!=='both'&&f.dataset.side!==side)});for(const id of ['both','before','after'])document.getElementById(id).setAttribute('aria-pressed',String(side===id));document.getElementById('note').textContent=x.name==='07-kit-compact-control'?'Compact mode is unchanged. The two screenshots are pixel-identical.':x.metric==='stats'?'All rating labels and values are retained. Attack breakdown follows sooner.':'Detailed effects share a continuous list. All source conditions and links remain visible.';const m=document.getElementById('metric');m.hidden=!x.metric;if(x.metric){const caption=x.metric==='stats'?'Distance from Combat ratings to Attack breakdown':'Complete Immunities & resistances section height';const change=Math.round((1-x.after/x.before)*100);m.setAttribute('aria-label',caption+': before '+Math.round(x.before)+' pixels, after '+Math.round(x.after)+' pixels, '+change+' percent less');m.innerHTML='<p>'+caption+' · <strong>'+change+'% less</strong></p>'+[['Before',x.before,''],['After',x.after,'after']].map(([label,v,c])=>'<div class="barrow"><span>'+label+'</span><div class="track"><span class="bar '+c+'" style="width:'+(v/x.before*100)+'%"></span></div><strong>'+Math.round(v).toLocaleString('en-US')+'px</strong></div>').join('')}}document.getElementById('view').addEventListener('change',update);for(const id of ['both','before','after'])document.getElementById(id).addEventListener('click',()=>{side=id;update()});update();</script></body></html>
